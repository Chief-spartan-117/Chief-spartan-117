<svg xmlns="http://www.w3.org/2000/svg" width="350" height="205" viewBox="0 0 350 205" role="img" aria-label="My Github Stats">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ff6e96; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f8f8f2; }
    .value { font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f8f8f2; }
    .small { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f8f8f2; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="349" height="204" fill="#282a36" stroke="#6272a4"/>
  <text x="25" y="35" class="title">My Github Stats</text>
  <g transform="translate(25, 70)">
    <circle cx="5" cy="-5" r="5" fill="#79dafa"/>
    <text x="20" y="0" class="label">Total Stars Earned:</text>
    <text x="300" y="0" class="value" text-anchor="end">3</text>
  </g>
  <g transform="translate(25, 95)">
    <circle cx="5" cy="-5" r="5" fill="#79dafa"/>
    <text x="20" y="0" class="label">Total Commits:</text>
    <text x="300" y="0" class="value" text-anchor="end">302</text>
  </g>
  <g transform="translate(25, 120)">
    <circle cx="5" cy="-5" r="5" fill="#79dafa"/>
    <text x="20" y="0" class="label">Total PRs:</text>
    <text x="300" y="0" class="value" text-anchor="end">27</text>
  </g>
  <g transform="translate(25, 145)">
    <circle cx="5" cy="-5" r="5" fill="#79dafa"/>
    <text x="20" y="0" class="label">Total Issues:</text>
    <text x="300" y="0" class="value" text-anchor="end">1</text>
  </g>
  <g transform="translate(25, 170)">
    <circle cx="5" cy="-5" r="5" fill="#79dafa"/>
    <text x="20" y="0" class="label">Followers:</text>
    <text x="300" y="0" class="value" text-anchor="end">13</text>
  </g>
</svg>
