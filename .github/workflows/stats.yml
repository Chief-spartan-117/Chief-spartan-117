name: Update GitHub stats cards

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/generate-stats.mjs
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate cards
        env:
          # Optional: add a STATS_TOKEN secret (classic PAT with "repo" + "read:user")
          # to include private repos/contributions. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_USERNAME: ${{ github.repository_owner }}
          # Optional: hide languages from the languages card, e.g. "Jupyter Notebook,HTML".
          STATS_EXCLUDE_LANGS: ""
        run: node .github/scripts/generate-stats.mjs

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet || git commit -m "chore: update stats cards"
          git push
